version: 1
identity:
  product: factoree-test
  linear:
    teamKey: FAC
bootstrap:
  command: export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 && mise install &&
    dotnet restore && (cd src/Anthology/ClientApp && npm ci --no-audit --no-fund
    --ignore-scripts)
  keyFiles:
    - .factoree/mise.toml
    - src/Anthology/Anthology.csproj
    - tests/Anthology.Tests/Anthology.Tests.csproj
    - src/Anthology/ClientApp/package.json
    - src/Anthology/ClientApp/package-lock.json
  allowedDomains:
    - api.nuget.org
    - auth.docker.io
    - builds.dotnet.microsoft.com
    - ci.dot.net
    - dot.net
    - github.com
    - mise-versions.jdx.dev
    - mise.jdx.dev
    - nodejs.org
    - production.cloudfront.docker.com
    - registry-1.docker.io
    - registry.npmjs.org
verify:
  commands:
    - name: build
      run: DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 dotnet build Anthology.slnx
services:
  compose: docker-compose.yml
  profiles: []
  seed: ./.factoree/seed.sh
  waitTimeoutSeconds: 180
docker: false
preview:
  enabled: true
  command: ./.factoree/preview.sh
  readyUrl: http://localhost:3000/
  timeoutSeconds: 600
sandbox:
  allowedDomains: []
secrets:
  require: []
