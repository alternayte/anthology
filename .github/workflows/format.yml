name: Format

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  csharpier:
    name: CSharpier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install formatter runtime
        run: npm ci --prefix tools/csharpier

      - name: Restore tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check .
